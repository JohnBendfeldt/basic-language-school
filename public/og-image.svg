<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="45%" style="stop-color:#1e1b4b"/>
      <stop offset="100%" style="stop-color:#1e3a8a"/>
    </linearGradient>

    <!-- Glowing Atmospheric Orbs -->
    <radialGradient id="indigoGlow" cx="20%" cy="25%" r="60%">
      <stop offset="0%" style="stop-color:#6366f1;stop-opacity:0.35"/>
      <stop offset="100%" style="stop-color:#6366f1;stop-opacity:0"/>
    </radialGradient>
    <radialGradient id="amberGlow" cx="85%" cy="75%" r="55%">
      <stop offset="0%" style="stop-color:#f59e0b;stop-opacity:0.22"/>
      <stop offset="100%" style="stop-color:#f59e0b;stop-opacity:0"/>
    </radialGradient>

    <!-- Unified Multi-Language Accent Ribbon (ES, FR, EN, RU) -->
    <linearGradient id="multiAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f59e0b"/>
      <stop offset="25%" style="stop-color:#ef4444"/>
      <stop offset="50%" style="stop-color:#3b82f6"/>
      <stop offset="75%" style="stop-color:#10b981"/>
      <stop offset="100%" style="stop-color:#8b5cf6"/>
    </linearGradient>

    <!-- Gold Badge Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fde047"/>
      <stop offset="60%" style="stop-color:#f59e0b"/>
      <stop offset="100%" style="stop-color:#d97706"/>
    </linearGradient>

    <!-- Subtle Grid Pattern -->
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="rgba(255,255,255,0.035)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- Glowing Atmospheric Orbs -->
  <rect width="1200" height="630" fill="url(#indigoGlow)"/>
  <rect width="1200" height="630" fill="url(#amberGlow)"/>

  <!-- Top & Bottom Accent Strips -->
  <rect x="0" y="0" width="1200" height="6" fill="url(#multiAccent)"/>
  <rect x="0" y="624" width="1200" height="6" fill="url(#multiAccent)"/>

  <!-- School Crest Emblem (68x68) -->
  <g transform="translate(80, 80)">
    <circle cx="34" cy="34" r="34" fill="#4338ca" stroke="rgba(255,255,255,0.25)" stroke-width="2"/>
    <circle cx="34" cy="34" r="30" fill="#312e81"/>
    <!-- Graduation Cap -->
    <path d="M34 16 L14 26 L34 36 L54 26 Z" fill="url(#goldGrad)"/>
    <path d="M22 31.5 V43 C22 47 27 50 34 50 C41 50 46 47 46 43 V31.5" stroke="#ffffff" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M54 27 V40" stroke="url(#goldGrad)" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Domain Badge -->
  <rect x="170" y="93" width="240" height="42" rx="21" fill="rgba(255,255,255,0.12)" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
  <text x="290" y="120" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="700" fill="#fde047" text-anchor="middle" letter-spacing="0.5">basiclanguage.school</text>

  <!-- Multi-Language Flags Badge -->
  <g transform="translate(430, 95)">
    <rect x="0" y="0" width="168" height="38" rx="19" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
    <text x="84" y="25" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" text-anchor="middle">🇪🇸 🇫🇷 🇬🇧 🇷🇺</text>
  </g>

  <!-- App Title -->
  <text x="80" y="235" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif" font-size="78" font-weight="900" fill="#ffffff" letter-spacing="-1.5">
    Basic Language School
  </text>

  <!-- Tagline -->
  <text x="83" y="295" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="30" font-weight="500" fill="#cbd5e1" letter-spacing="0.3">
    Practical Language Learning for Real Careers &amp; Life
  </text>

  <!-- Underline Accent Bar -->
  <rect x="80" y="325" width="580" height="5" rx="2.5" fill="url(#multiAccent)"/>

  <!-- Subtitle Description -->
  <text x="83" y="365" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" fill="#94a3b8" font-weight="400">
    Master Spanish, French, English, and Russian with studio audio,
  </text>
  <text x="83" y="394" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" fill="#94a3b8" font-weight="400">
    spaced repetition, and practical workplace vocabulary.
  </text>

  <!-- Feature Pills -->
  <g transform="translate(80, 435)">
    <!-- Pill 1: 4 Core Languages -->
    <rect x="0" y="0" width="180" height="44" rx="22" fill="rgba(255,255,255,0.1)" stroke="rgba(255,255,255,0.18)" stroke-width="1.2"/>
    <text x="90" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="600" fill="#e2e8f0" text-anchor="middle">🌍 4 Languages</text>

    <!-- Pill 2: Studio Audio -->
    <rect x="195" y="0" width="180" height="44" rx="22" fill="rgba(255,255,255,0.1)" stroke="rgba(255,255,255,0.18)" stroke-width="1.2"/>
    <text x="285" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="600" fill="#e2e8f0" text-anchor="middle">🎙️ Studio Audio</text>

    <!-- Pill 3: Spaced Repetition -->
    <rect x="390" y="0" width="200" height="44" rx="22" fill="rgba(255,255,255,0.1)" stroke="rgba(255,255,255,0.18)" stroke-width="1.2"/>
    <text x="490" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="600" fill="#e2e8f0" text-anchor="middle">🧠 Spaced Repetition</text>
  </g>

  <!-- Right Hero Card (Modern Preview Card) -->
  <g transform="translate(740, 110)">
    <!-- Card Base -->
    <rect x="0" y="0" width="380" height="430" rx="24" fill="rgba(30, 41, 59, 0.75)" stroke="rgba(255,255,255,0.2)" stroke-width="1.5"/>
    <rect x="0" y="0" width="380" height="60" rx="24" fill="rgba(255,255,255,0.06)"/>
    <circle cx="32" cy="30" r="6" fill="#ef4444"/>
    <circle cx="52" cy="30" r="6" fill="#f59e0b"/>
    <circle cx="72" cy="30" r="6" fill="#10b981"/>
    <text x="210" y="36" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700" fill="#94a3b8" text-anchor="middle">basiclanguage.school</text>

    <!-- Course Card 1: Spanish -->
    <g transform="translate(24, 80)">
      <rect x="0" y="0" width="332" height="68" rx="14" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
      <text x="20" y="42" font-size="28">🇪🇸</text>
      <text x="64" y="34" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="700" fill="#ffffff">Basic Spanish</text>
      <text x="64" y="52" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#94a3b8">Alphabet · Phrases · Studio Audio</text>
    </g>

    <!-- Course Card 2: French -->
    <g transform="translate(24, 160)">
      <rect x="0" y="0" width="332" height="68" rx="14" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
      <text x="20" y="42" font-size="28">🇫🇷</text>
      <text x="64" y="34" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="700" fill="#ffffff">Basic French</text>
      <text x="64" y="52" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#94a3b8">Phonetics · Real Dialogue · Audio</text>
    </g>

    <!-- Course Card 3: English -->
    <g transform="translate(24, 240)">
      <rect x="0" y="0" width="332" height="68" rx="14" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
      <text x="20" y="42" font-size="28">🇬🇧</text>
      <text x="64" y="34" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="700" fill="#ffffff">Basic English</text>
      <text x="64" y="52" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#94a3b8">Oxford 3000 · Phonics · Numbers</text>
    </g>

    <!-- Course Card 4: Russian -->
    <g transform="translate(24, 320)">
      <rect x="0" y="0" width="332" height="68" rx="14" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
      <text x="20" y="42" font-size="28">🇷🇺</text>
      <text x="64" y="34" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="700" fill="#ffffff">Basic Russian</text>
      <text x="64" y="52" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#94a3b8">Cyrillic Script · Grammar · Quizzes</text>
    </g>
  </g>
</svg>
