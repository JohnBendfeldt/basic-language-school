<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <!-- Background Gradient (Dark Modern Canvas) -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0b0f19"/>
      <stop offset="50%" style="stop-color:#111827"/>
      <stop offset="100%" style="stop-color:#0d1527"/>
    </linearGradient>

    <!-- Glowing Background Ambient Lighting -->
    <radialGradient id="indigoAmbient" cx="15%" cy="30%" r="55%">
      <stop offset="0%" style="stop-color:#4f46e5;stop-opacity:0.25"/>
      <stop offset="100%" style="stop-color:#4f46e5;stop-opacity:0"/>
    </radialGradient>
    <radialGradient id="amberAmbient" cx="85%" cy="80%" r="50%">
      <stop offset="0%" style="stop-color:#f59e0b;stop-opacity:0.18"/>
      <stop offset="100%" style="stop-color:#f59e0b;stop-opacity:0"/>
    </radialGradient>
    <radialGradient id="blueCardAmbient" cx="90%" cy="20%" r="60%">
      <stop offset="0%" style="stop-color:#38bdf8;stop-opacity:0.15"/>
      <stop offset="100%" style="stop-color:#38bdf8;stop-opacity:0"/>
    </radialGradient>

    <!-- Multi-Language Spectrum Accent Bar -->
    <linearGradient id="spectrum" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f59e0b"/>
      <stop offset="25%" style="stop-color:#ef4444"/>
      <stop offset="50%" style="stop-color:#3b82f6"/>
      <stop offset="75%" style="stop-color:#10b981"/>
      <stop offset="100%" style="stop-color:#8b5cf6"/>
    </linearGradient>

    <!-- Gold Accent Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fde047"/>
      <stop offset="60%" style="stop-color:#f59e0b"/>
      <stop offset="100%" style="stop-color:#d97706"/>
    </linearGradient>

    <!-- Glass Fill Gradient for Right Window -->
    <linearGradient id="glassWindow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e293b;stop-opacity:0.92"/>
      <stop offset="100%" style="stop-color:#0f172a;stop-opacity:0.94"/>
    </linearGradient>

    <!-- Glass Fill Gradient for Course Rows -->
    <linearGradient id="rowGlass" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.07"/>
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0.03"/>
    </linearGradient>

    <!-- Dot Grid Pattern -->
    <pattern id="dotGrid" width="36" height="36" patternUnits="userSpaceOnUse">
      <circle cx="18" cy="18" r="1.2" fill="#ffffff" fill-opacity="0.08"/>
    </pattern>

    <!-- Vector Flags Definition -->
    <!-- Spanish Flag (40x28) -->
    <g id="flag-es">
      <clipPath id="es-clip"><rect width="40" height="28" rx="4"/></clipPath>
      <g clip-path="url(#es-clip)">
        <rect width="40" height="7" fill="#aa151b"/>
        <rect y="7" width="40" height="14" fill="#f1bf00"/>
        <rect y="21" width="40" height="7" fill="#aa151b"/>
      </g>
      <rect width="40" height="28" rx="4" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="1"/>
    </g>

    <!-- French Flag (40x28) -->
    <g id="flag-fr">
      <clipPath id="fr-clip"><rect width="40" height="28" rx="4"/></clipPath>
      <g clip-path="url(#fr-clip)">
        <rect width="13.3" height="28" fill="#002654"/>
        <rect x="13.3" width="13.4" height="28" fill="#ffffff"/>
        <rect x="26.7" width="13.3" height="28" fill="#ce1126"/>
      </g>
      <rect width="40" height="28" rx="4" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="1"/>
    </g>

    <!-- British Union Jack Flag (40x28) -->
    <g id="flag-en">
      <clipPath id="en-clip"><rect width="40" height="28" rx="4"/></clipPath>
      <g clip-path="url(#en-clip)">
        <rect width="40" height="28" fill="#012169"/>
        <path d="M0,0 L40,28 M40,0 L0,28" stroke="#ffffff" stroke-width="5"/>
        <path d="M0,0 L40,28 M40,0 L0,28" stroke="#c8102e" stroke-width="2.6"/>
        <path d="M20,0 v28 M0,14 h40" stroke="#ffffff" stroke-width="8"/>
        <path d="M20,0 v28 M0,14 h40" stroke="#c8102e" stroke-width="4.8"/>
      </g>
      <rect width="40" height="28" rx="4" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="1"/>
    </g>

    <!-- Russian Flag (40x28) -->
    <g id="flag-ru">
      <clipPath id="ru-clip"><rect width="40" height="28" rx="4"/></clipPath>
      <g clip-path="url(#ru-clip)">
        <rect width="40" height="9.3" fill="#ffffff"/>
        <rect y="9.3" width="40" height="9.4" fill="#0039a6"/>
        <rect y="18.7" width="40" height="9.3" fill="#d52b1e"/>
      </g>
      <rect width="40" height="28" rx="4" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="1"/>
    </g>

    <!-- Mini Vector Flags for Top Header (24x17) -->
    <g id="mini-flag-es">
      <clipPath id="m-es-clip"><rect width="24" height="17" rx="3"/></clipPath>
      <g clip-path="url(#m-es-clip)">
        <rect width="24" height="4.25" fill="#aa151b"/>
        <rect y="4.25" width="24" height="8.5" fill="#f1bf00"/>
        <rect y="12.75" width="24" height="4.25" fill="#aa151b"/>
      </g>
      <rect width="24" height="17" rx="3" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="0.8"/>
    </g>

    <g id="mini-flag-fr">
      <clipPath id="m-fr-clip"><rect width="24" height="17" rx="3"/></clipPath>
      <g clip-path="url(#m-fr-clip)">
        <rect width="8" height="17" fill="#002654"/>
        <rect x="8" width="8" height="17" fill="#ffffff"/>
        <rect x="16" width="8" height="17" fill="#ce1126"/>
      </g>
      <rect width="24" height="17" rx="3" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="0.8"/>
    </g>

    <g id="mini-flag-en">
      <clipPath id="m-en-clip"><rect width="24" height="17" rx="3"/></clipPath>
      <g clip-path="url(#m-en-clip)">
        <rect width="24" height="17" fill="#012169"/>
        <path d="M0,0 L24,17 M24,0 L0,17" stroke="#ffffff" stroke-width="3"/>
        <path d="M0,0 L24,17 M24,0 L0,17" stroke="#c8102e" stroke-width="1.6"/>
        <path d="M12,0 v17 M0,8.5 h24" stroke="#ffffff" stroke-width="5"/>
        <path d="M12,0 v17 M0,8.5 h24" stroke="#c8102e" stroke-width="3"/>
      </g>
      <rect width="24" height="17" rx="3" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="0.8"/>
    </g>

    <g id="mini-flag-ru">
      <clipPath id="m-ru-clip"><rect width="24" height="17" rx="3"/></clipPath>
      <g clip-path="url(#m-ru-clip)">
        <rect width="24" height="5.6" fill="#ffffff"/>
        <rect y="5.6" width="24" height="5.8" fill="#0039a6"/>
        <rect y="11.4" width="24" height="5.6" fill="#d52b1e"/>
      </g>
      <rect width="24" height="17" rx="3" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="0.8"/>
    </g>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>
  <rect width="1200" height="630" fill="url(#dotGrid)"/>

  <!-- Atmospheric Glow Orbs -->
  <rect width="1200" height="630" fill="url(#indigoAmbient)"/>
  <rect width="1200" height="630" fill="url(#amberAmbient)"/>
  <rect width="1200" height="630" fill="url(#blueCardAmbient)"/>

  <!-- Top Spectrum Border Strip -->
  <rect x="0" y="0" width="1200" height="5" fill="url(#spectrum)"/>
  <rect x="0" y="625" width="1200" height="5" fill="url(#spectrum)"/>

  <!-- ================= LEFT COLUMN: CONTENT ================= -->

  <!-- Top Bar: School Icon + Domain Pill + Vector Flags -->
  <g transform="translate(72, 60)">
    <!-- School Crest Emblem (52x52) -->
    <g>
      <rect x="0" y="0" width="52" height="52" rx="16" fill="#4338ca" stroke="rgba(255,255,255,0.25)" stroke-width="1.5"/>
      <!-- Graduation Cap -->
      <path d="M26 14 L11 22 L26 30 L41 22 Z" fill="url(#goldGrad)"/>
      <path d="M17 26.5 V35.5 C17 38.5 21 41 26 41 C31 41 35 38.5 35 35.5 V26.5" stroke="#ffffff" stroke-width="2.4" fill="none" stroke-linecap="round"/>
      <path d="M41 23 V33" stroke="url(#goldGrad)" stroke-width="2.4" stroke-linecap="round"/>
    </g>

    <!-- Domain Pill -->
    <rect x="66" y="7" width="230" height="38" rx="19" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.18)" stroke-width="1"/>
    <text x="181" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" fill="#fde047" text-anchor="middle" letter-spacing="0.4">basiclanguage.school</text>

    <!-- Vector Flags Mini Badge -->
    <g transform="translate(308, 7)">
      <rect x="0" y="0" width="154" height="38" rx="19" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.14)" stroke-width="1"/>
      <use href="#mini-flag-es" x="15" y="10.5"/>
      <use href="#mini-flag-fr" x="47" y="10.5"/>
      <use href="#mini-flag-en" x="79" y="10.5"/>
      <use href="#mini-flag-ru" x="111" y="10.5"/>
    </g>
  </g>

  <!-- Main Headline (Tightened font size & balanced spacing to completely avoid collision) -->
  <!-- Left margin: 72px, right room: up to 680px (608px total width) -->
  <text x="72" y="186" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif" font-size="54" font-weight="900" fill="#ffffff" letter-spacing="-1.2">
    Basic Language School
  </text>

  <!-- Tagline -->
  <text x="73" y="234" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="600" fill="#cbd5e1" letter-spacing="0.2">
    Practical Language Learning for Real Careers &amp; Life
  </text>

  <!-- Underline Accent Bar -->
  <rect x="73" y="258" width="530" height="4" rx="2" fill="url(#spectrum)"/>

  <!-- Subtitle Paragraph -->
  <text x="73" y="296" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="17" fill="#94a3b8" font-weight="400">
    Master Spanish, French, English, and Russian with studio neural audio,
  </text>
  <text x="73" y="322" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="17" fill="#94a3b8" font-weight="400">
    spaced repetition, phonetics, and practical workplace vocabulary.
  </text>

  <!-- Feature Value Pills -->
  <g transform="translate(72, 360)">
    <!-- Pill 1: 4 Languages -->
    <g transform="translate(0, 0)">
      <rect width="168" height="42" rx="21" fill="rgba(255,255,255,0.07)" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
      <!-- Globe icon SVG -->
      <circle cx="28" cy="21" r="10" fill="none" stroke="#60a5fa" stroke-width="1.8"/>
      <ellipse cx="28" cy="21" rx="4.5" ry="10" fill="none" stroke="#60a5fa" stroke-width="1.4"/>
      <line x1="18" y1="21" x2="38" y2="21" stroke="#60a5fa" stroke-width="1.4"/>
      <text x="47" y="27" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14.5" font-weight="600" fill="#f1f5f9">4 Languages</text>
    </g>

    <!-- Pill 2: Studio Neural Audio -->
    <g transform="translate(180, 0)">
      <rect width="186" height="42" rx="21" fill="rgba(255,255,255,0.07)" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
      <!-- Audio wave / Speaker icon SVG -->
      <path d="M22 17 L26 14 L30 14 L35 10 V32 L30 28 L26 28 L22 25 Z" fill="#fde047"/>
      <path d="M37 17 C38.5 19 39.5 21 39.5 23 C39.5 25 38.5 27 37 29" stroke="#fde047" stroke-width="1.8" fill="none" stroke-linecap="round"/>
      <path d="M40 14 C42.5 16.5 44 19.5 44 23 C44 26.5 42.5 29.5 40 32" stroke="#fde047" stroke-width="1.8" fill="none" stroke-linecap="round"/>
      <text x="50" y="27" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14.5" font-weight="600" fill="#f1f5f9">Studio Audio</text>
    </g>

    <!-- Pill 3: Spaced Repetition -->
    <g transform="translate(378, 0)">
      <rect width="184" height="42" rx="21" fill="rgba(255,255,255,0.07)" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
      <!-- Brain / Cycle icon SVG -->
      <path d="M22 21 A6 6 0 1 1 34 21 A6 6 0 1 1 22 21" fill="none" stroke="#f472b6" stroke-width="1.8"/>
      <path d="M25 18 C25 24 31 24 31 18" stroke="#f472b6" stroke-width="1.4" fill="none"/>
      <text x="44" y="27" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14.5" font-weight="600" fill="#f1f5f9">Spaced Repetition</text>
    </g>
  </g>

  <!-- Trust / Guarantee Footer Row -->
  <g transform="translate(73, 435)">
    <!-- Free Forever Badge -->
    <g transform="translate(0, 0)">
      <rect width="134" height="34" rx="8" fill="rgba(16, 185, 129, 0.12)" stroke="rgba(16, 185, 129, 0.3)" stroke-width="1"/>
      <circle cx="16" cy="17" r="4.5" fill="#10b981"/>
      <text x="27" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#6ee7b7">100% Free App</text>
    </g>

    <!-- Zero Ads Badge -->
    <g transform="translate(146, 0)">
      <rect width="134" height="34" rx="8" fill="rgba(99, 102, 241, 0.12)" stroke="rgba(99, 102, 241, 0.3)" stroke-width="1"/>
      <circle cx="16" cy="17" r="4.5" fill="#818cf8"/>
      <text x="27" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#c7d2fe">No Paywalls</text>
    </g>

    <!-- Speed Control Badge -->
    <g transform="translate(292, 0)">
      <rect width="168" height="34" rx="8" fill="rgba(245, 158, 11, 0.12)" stroke="rgba(245, 158, 11, 0.3)" stroke-width="1"/>
      <circle cx="16" cy="17" r="4.5" fill="#f59e0b"/>
      <text x="27" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#fde68a">0.50x – 1.25x Audio</text>
    </g>
  </g>


  <!-- ================= RIGHT COLUMN: INTERACTIVE APP PREVIEW ================= -->
  <!-- Shifted further right to x=700, width=435 to eliminate any text overlap -->
  <g transform="translate(700, 72)">
    <!-- Window Outer Drop Shadow Box -->
    <rect x="-8" y="-8" width="446" height="496" rx="26" fill="rgba(0,0,0,0.4)"/>

    <!-- Window Main Frame -->
    <rect x="0" y="0" width="430" height="480" rx="20" fill="url(#glassWindow)" stroke="rgba(255,255,255,0.18)" stroke-width="1.5"/>

    <!-- Window Title Bar -->
    <rect x="0" y="0" width="430" height="52" rx="20" fill="rgba(255,255,255,0.04)"/>
    <line x1="0" y1="52" x2="430" y2="52" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>

    <!-- macOS Window Controls (Traffic Lights) -->
    <circle cx="28" cy="26" r="6" fill="#ef4444"/>
    <circle cx="48" cy="26" r="6" fill="#f59e0b"/>
    <circle cx="68" cy="26" r="6" fill="#10b981"/>

    <!-- Window Header Title -->
    <text x="236" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#94a3b8" text-anchor="middle" letter-spacing="0.3">
      basiclanguage.school
    </text>

    <!-- Audio Speed Pill in Header (Vector Audio Wave) -->
    <rect x="344" y="14" width="68" height="24" rx="12" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
    <!-- Speaker SVG in pill -->
    <path d="M352 23 L355 21 L358 21 L361 18 V30 L358 27 L355 27 L352 25 Z" fill="#fde047"/>
    <path d="M363 22 C364 23 364 25 363 26" stroke="#fde047" stroke-width="1.2" fill="none"/>
    <text x="385" y="30.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#fde047" text-anchor="middle">0.75×</text>

    <!-- ================= COURSE CARDS ================= -->

    <!-- Card 1: Spanish -->
    <g transform="translate(18, 70)">
      <rect width="394" height="84" rx="14" fill="url(#rowGlass)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
      <use href="#flag-es" x="20" y="28"/>
      <!-- Course Info -->
      <text x="74" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="19" font-weight="800" fill="#ffffff">
        Basic Spanish
      </text>
      <text x="74" y="60" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="500" fill="#94a3b8">
        Jorge Neural · 27 Letters · Essential Phrases
      </text>
      <!-- Small Sound Wave Pill -->
      <rect x="312" y="28" width="64" height="28" rx="14" fill="rgba(99, 102, 241, 0.2)" stroke="rgba(99, 102, 241, 0.4)" stroke-width="1"/>
      <text x="344" y="46.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#c7d2fe" text-anchor="middle">Studio</text>
    </g>

    <!-- Card 2: French -->
    <g transform="translate(18, 168)">
      <rect width="394" height="84" rx="14" fill="url(#rowGlass)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
      <use href="#flag-fr" x="20" y="28"/>
      <!-- Course Info -->
      <text x="74" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="19" font-weight="800" fill="#ffffff">
        Basic French
      </text>
      <text x="74" y="60" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="500" fill="#94a3b8">
        Henri Neural · Phonetics · Daily Dialogue
      </text>
      <!-- Small Sound Wave Pill -->
      <rect x="312" y="28" width="64" height="28" rx="14" fill="rgba(56, 189, 248, 0.2)" stroke="rgba(56, 189, 248, 0.4)" stroke-width="1"/>
      <text x="344" y="46.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#bae6fd" text-anchor="middle">Studio</text>
    </g>

    <!-- Card 3: English -->
    <g transform="translate(18, 266)">
      <rect width="394" height="84" rx="14" fill="url(#rowGlass)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
      <use href="#flag-en" x="20" y="28"/>
      <!-- Course Info -->
      <text x="74" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="19" font-weight="800" fill="#ffffff">
        Basic English
      </text>
      <text x="74" y="60" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="500" fill="#94a3b8">
        Jenny Neural · Oxford 3000 · Phonics Guide
      </text>
      <!-- Small Sound Wave Pill -->
      <rect x="312" y="28" width="64" height="28" rx="14" fill="rgba(245, 158, 11, 0.2)" stroke="rgba(245, 158, 11, 0.4)" stroke-width="1"/>
      <text x="344" y="46.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#fde68a" text-anchor="middle">Studio</text>
    </g>

    <!-- Card 4: Russian -->
    <g transform="translate(18, 364)">
      <rect width="394" height="84" rx="14" fill="url(#rowGlass)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
      <use href="#flag-ru" x="20" y="28"/>
      <!-- Course Info -->
      <text x="74" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="19" font-weight="800" fill="#ffffff">
        Basic Russian
      </text>
      <text x="74" y="60" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="500" fill="#94a3b8">
        Svetlana Neural · Cyrillic 33 · Adaptive Quiz
      </text>
      <!-- Small Sound Wave Pill -->
      <rect x="312" y="28" width="64" height="28" rx="14" fill="rgba(16, 185, 129, 0.2)" stroke="rgba(16, 185, 129, 0.4)" stroke-width="1"/>
      <text x="344" y="46.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#a7f3d0" text-anchor="middle">Studio</text>
    </g>
  </g>
</svg>
