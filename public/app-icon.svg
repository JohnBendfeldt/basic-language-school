<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <!-- Background Gradient (Deep Indigo / Slate) -->
    <linearGradient id="iconBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4338ca"/>
      <stop offset="50%" style="stop-color:#1e1b4b"/>
      <stop offset="100%" style="stop-color:#0f172a"/>
    </linearGradient>

    <!-- Gold Graduation Accent -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fde047"/>
      <stop offset="60%" style="stop-color:#f59e0b"/>
      <stop offset="100%" style="stop-color:#d97706"/>
    </linearGradient>

    <!-- Multi-Language Spectrum Accent -->
    <linearGradient id="flagRibbon" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f59e0b"/>
      <stop offset="33%" style="stop-color:#ef4444"/>
      <stop offset="66%" style="stop-color:#3b82f6"/>
      <stop offset="100%" style="stop-color:#10b981"/>
    </linearGradient>

    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#020617" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Squircle App Icon Base -->
  <rect x="16" y="16" width="480" height="480" rx="110" fill="url(#iconBg)"/>

  <!-- Subtle Inner Border -->
  <rect x="20" y="20" width="472" height="472" rx="106" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="4"/>

  <!-- Multi-Language Spectrum Strip (Top-Left) -->
  <rect x="64" y="52" width="64" height="6" rx="3" fill="url(#flagRibbon)"/>

  <!-- Center Artwork: Academic Graduation Cap & Book Foundation -->
  <g filter="url(#shadow)" transform="translate(0, 16)">
    <!-- Open Book Foundation Base -->
    <path d="M156 370 C206 350 256 364 256 364 C256 364 306 350 356 370 V410 C306 390 256 404 256 404 C256 404 206 390 156 410 Z" fill="rgba(255,255,255,0.18)"/>
    <path d="M160 366 C208 348 256 362 256 362 C256 362 304 348 352 366" stroke="rgba(255,255,255,0.35)" stroke-width="3" fill="none"/>

    <!-- Graduation Cap Top Diamond -->
    <path d="M256 120 L76 200 L256 280 L436 200 Z" fill="url(#goldGrad)"/>

    <!-- Graduation Cap Under-Brim -->
    <path d="M150 244 V330 C150 365 195 395 256 395 C317 395 362 365 362 330 V244 L256 292 Z" fill="#ffffff" fill-opacity="0.96"/>

    <!-- Graduation Cap Inner Skull Shadow -->
    <ellipse cx="256" cy="275" rx="80" ry="24" fill="#1e1b4b" fill-opacity="0.22"/>

    <!-- Tassel String -->
    <path d="M436 205 V325" stroke="url(#goldGrad)" stroke-width="12" stroke-linecap="round"/>
    <!-- Tassel Bulb -->
    <circle cx="436" cy="336" r="14" fill="url(#goldGrad)"/>
    <path d="M430 342 L424 372 M436 342 L436 376 M442 342 L448 372" stroke="url(#goldGrad)" stroke-width="6" stroke-linecap="round"/>

    <!-- Graduation Cap Shield Inset -->
    <circle cx="256" cy="328" r="26" fill="#4338ca"/>
    <!-- World / Globe Icon inside shield -->
    <circle cx="256" cy="328" r="18" fill="none" stroke="#fde047" stroke-width="2.5"/>
    <ellipse cx="256" cy="328" rx="8" ry="18" fill="none" stroke="#fde047" stroke-width="2"/>
    <line x1="238" y1="328" x2="274" y2="328" stroke="#fde047" stroke-width="2"/>
  </g>
</svg>
