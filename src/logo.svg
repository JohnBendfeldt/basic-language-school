<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <!-- Background Gradient (Deep Indigo / Midnight Navy) -->
    <linearGradient id="iconBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#312e81"/>
      <stop offset="50%" style="stop-color:#1e1b4b"/>
      <stop offset="100%" style="stop-color:#0b0f19"/>
    </linearGradient>

    <!-- Gold Graduation Cap Top Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fde047"/>
      <stop offset="50%" style="stop-color:#f59e0b"/>
      <stop offset="100%" style="stop-color:#d97706"/>
    </linearGradient>

    <!-- Unified Multi-Language Spectrum Strip (ES, FR, EN, RU) -->
    <linearGradient id="flagRibbon" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f59e0b"/>
      <stop offset="28%" style="stop-color:#ef4444"/>
      <stop offset="54%" style="stop-color:#3b82f6"/>
      <stop offset="78%" style="stop-color:#10b981"/>
      <stop offset="100%" style="stop-color:#8b5cf6"/>
    </linearGradient>

    <!-- Shadow for Academic Crest -->
    <filter id="iconShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#020617" flood-opacity="0.55"/>
    </filter>
  </defs>

  <!-- Squircle App Icon Base -->
  <rect x="16" y="16" width="480" height="480" rx="110" fill="url(#iconBg)"/>

  <!-- Subtle Inner Translucent Bevel -->
  <rect x="20" y="20" width="472" height="472" rx="106" fill="none" stroke="rgba(255,255,255,0.18)" stroke-width="4"/>

  <!-- Multi-Language Spectrum Strip (Top-Left Accent) -->
  <rect x="68" y="56" width="76" height="8" rx="4" fill="url(#flagRibbon)"/>

  <!-- Center Artwork: Academic Graduation Cap, Book Foundation & World Inset -->
  <g filter="url(#iconShadow)" transform="translate(0, 14)">
    <!-- Open Book Foundation Base -->
    <path d="M152 368 C204 346 256 360 256 360 C256 360 308 346 360 368 V410 C308 388 256 402 256 402 C256 402 204 388 152 410 Z" fill="rgba(255,255,255,0.15)"/>
    <path d="M156 364 C206 344 256 358 256 358 C256 358 306 344 356 364" stroke="rgba(255,255,255,0.3)" stroke-width="3" fill="none"/>

    <!-- Graduation Cap Top Diamond (Slightly larger, authoritative) -->
    <path d="M256 112 L68 198 L256 284 L444 198 Z" fill="url(#goldGrad)"/>

    <!-- Cap Highlight Specular -->
    <path d="M256 114 L256 282 L440 198 Z" fill="rgba(0,0,0,0.06)"/>

    <!-- Graduation Cap Under-Brim -->
    <path d="M144 246 V332 C144 370 192 400 256 400 C320 400 368 370 368 332 V246 L256 296 Z" fill="#ffffff" fill-opacity="0.97"/>

    <!-- Graduation Cap Inner Skull Shadow -->
    <ellipse cx="256" cy="278" rx="84" ry="24" fill="#1e1b4b" fill-opacity="0.22"/>

    <!-- Tassel String -->
    <path d="M444 204 V328" stroke="url(#goldGrad)" stroke-width="12" stroke-linecap="round"/>
    <!-- Tassel Bulb & Fringe -->
    <circle cx="444" cy="340" r="14" fill="url(#goldGrad)"/>
    <path d="M438 346 L432 378 M444 346 L444 382 M450 346 L456 378" stroke="url(#goldGrad)" stroke-width="6" stroke-linecap="round"/>

    <!-- Academic Shield Inset -->
    <circle cx="256" cy="332" r="28" fill="#4338ca"/>
    <!-- Universal Globe Wireframe inside shield -->
    <circle cx="256" cy="332" r="20" fill="none" stroke="#fde047" stroke-width="2.6"/>
    <ellipse cx="256" cy="332" rx="9" ry="20" fill="none" stroke="#fde047" stroke-width="2.2"/>
    <line x1="236" y1="332" x2="276" y2="332" stroke="#fde047" stroke-width="2.2"/>
  </g>
</svg>
